name: Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "archive/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [sandbox, uat, sofis]
        default: sandbox
      sha:
        description: "Commit to build & deploy (full or abbreviated SHA; blank = HEAD of the chosen ref). Used mainly to promote a UAT-vetted build to sofis."
        type: string
        required: false
        default: ""

# Required for actions/checkout + GHCR push via GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: crxnit

jobs:
  build-and-scan:
    name: Build & scan ${{ matrix.service }}
    # Native arm64 runner (free on public repos, GA since late 2024). Matches
    # the deploy-target architecture so QEMU emulation isn't needed — cuts
    # build time roughly 3-5x vs the ubuntu-latest + setup-qemu approach.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [server, webapp]
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so an abbreviated `sha` input can be resolved + checked out.
          fetch-depth: 0

      - id: sha
        name: Resolve & check out target commit, compute short SHA
        run: |
          REQ="${{ github.event.inputs.sha }}"
          if [ -n "$REQ" ]; then
            FULL="$(git rev-parse --verify "${REQ}^{commit}")" \
              || { echo "::error::requested sha '$REQ' not found in history"; exit 1; }
            git checkout -q "$FULL"
            echo "Building requested commit $FULL"
          fi
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          # Runner is arm64; build defaults to host platform, producing an
          # arm64-only image (no QEMU step needed).
          provenance: false
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:latest
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Trivy is a BLOCKING gate (exit-code 1): any fixable HIGH/CRITICAL not in
      # .trivyignore fails the build. The pre-existing server-image debt is an
      # explicit, dated baseline in .trivyignore (see that file + docs/CI-CD.md);
      # the devDep-leak cleanup + safe overrides cut findings 155 -> 105 and all
      # but one CRITICAL before this flip. Webapp image is clean. New
      # HIGH/CRITICAL findings now block deploys until fixed or justified.
      - name: Trivy scan ${{ matrix.service }} (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  deploy-sandbox:
    name: Deploy to sandbox
    needs: build-and-scan
    # On push to develop: always runs (sandbox auto-deploy).
    # On manual dispatch with environment=sandbox: runs.
    # On manual dispatch with environment=uat: skipped (deploy-uat runs directly).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'sandbox')
    runs-on: ubuntu-latest
    environment: sandbox
    # Job-level concurrency: a push run now exercises both deploy jobs, so
    # the lock has to be per-env to avoid blocking unrelated parallel manual
    # dispatches. Don't cancel in-progress — interrupting a half-done
    # `docker compose pull` leaves the VPS in a worse state than waiting.
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote deploy
        env:
          SHA: ${{ needs.build-and-scan.outputs.sha-short }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              "${{ secrets.VPS_HOST }}" \
              "$SHA $SHA"

  deploy-sofis:
    name: Deploy to Sofi's (live client)
    needs: build-and-scan
    # Manual one-click promote ONLY — never on push. Pick a UAT-vetted build via
    # the optional `sha` input (blank = HEAD of the dispatched ref). The `sofis`
    # GitHub Environment can carry a required-reviewer rule for a second gate.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'sofis'
    runs-on: ubuntu-latest
    environment: sofis
    concurrency:
      group: deploy-sofis
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The remote deploy.sh re-derives the GHCR tag (sha-<short>) from the SHA
      # built+scanned above, so the promoted image is exactly what cleared Trivy.
      - name: Trigger remote deploy
        env:
          SHA: ${{ needs.build-and-scan.outputs.sha-short }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              "${{ secrets.VPS_HOST }}" \
              "$SHA $SHA"

  deploy-uat:
    name: Deploy to uat
    needs: [build-and-scan, deploy-sandbox]
    # On push to develop: runs only after sandbox finishes successfully —
    # sandbox's `/api/health` smoke gate is therefore the UAT safety net.
    # On manual dispatch with environment=uat: runs without requiring
    # sandbox; deploy-sandbox is `skipped`, so `if: always()` is needed for
    # downstream evaluation past a skipped upstream.
    if: |
      always() &&
      needs.build-and-scan.result == 'success' &&
      (
        (github.event_name == 'push' && needs.deploy-sandbox.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat')
      )
    runs-on: ubuntu-latest
    environment: uat
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote deploy
        env:
          SHA: ${{ needs.build-and-scan.outputs.sha-short }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              "${{ secrets.VPS_HOST }}" \
              "$SHA $SHA"
