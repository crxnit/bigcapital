# Traefik STATIC config — bundled edge for the dedicated Sofi's VPS.
# Mounted read-only at /etc/traefik/traefik.yml. Self-contained: this box has
# no shared portal Traefik, so we terminate TLS and route here.
#
# ACME email is set below to letsencrypt@jjocllc.com (Traefik static config does
# NOT interpolate env vars, so it's hard-coded). NOTE: this whole bundled-Traefik
# edge may be dropped in favor of the host's standard Traefik (sandbox-bc style) —
# if so, this file is unused and the host resolver's email applies instead.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: letsencrypt@jjocllc.com # operator alias — receives LE expiry/policy notices
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Routers/services/middlewares live in the dynamic config (traefik-dynamic/).
log:
  level: INFO
