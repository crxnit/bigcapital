# Traefik DYNAMIC config — Sofi's Mini Donuts dedicated VPS.
# Lives in the HOST Traefik's dynamic dir: /srv/portal/traefik/dynamic/sofis-bc.yml
# (NOT inside the client stack). Host Traefik hot-reloads it.
#
# ACCESS MODEL: client logs in directly. NO JJOC Google OAuth edge here — this is
# a separate box outside .jjocllc.com. Bigcapital's JWT is the identity gate. We
# REUSE the host Traefik's predefined `security-headers` + `rate-limit` middlewares
# (from /srv/portal/traefik/dynamic/middlewares.yml) by `@file` reference — do NOT
# redefine them here (duplicate names in one provider conflict).
#
# The Square webhook router intentionally omits all middleware: HMAC signature is
# the auth, and rate-limiting Square's delivery is undesirable.

http:
  routers:
    bigcapital-sofis-api:
      rule: "Host(`books.sofisminidonuts.com`) && (PathPrefix(`/api`) || PathPrefix(`/socket`) || PathPrefix(`/public`))"
      service: bigcapital-sofis-api
      entryPoints: [websecure]
      priority: 10
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - rate-limit@file

    bigcapital-sofis-square-webhook:
      rule: "Host(`books.sofisminidonuts.com`) && PathPrefix(`/api/integrations/square/webhooks`)"
      service: bigcapital-sofis-api
      entryPoints: [websecure]
      priority: 20
      tls:
        certResolver: letsencrypt

    bigcapital-sofis-webapp:
      rule: "Host(`books.sofisminidonuts.com`)"
      service: bigcapital-sofis-webapp
      entryPoints: [websecure]
      priority: 1
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - rate-limit@file

  services:
    bigcapital-sofis-api:
      loadBalancer:
        sticky:
          cookie:
            name: bigcapital_sofis_sticky
            secure: true
            httpOnly: true
        servers:
          - url: "http://bigcapital-sofis-server:3000"

    bigcapital-sofis-webapp:
      loadBalancer:
        servers:
          - url: "http://bigcapital-sofis-webapp:80"
