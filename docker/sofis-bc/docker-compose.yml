# Dedicated, single-client PRODUCTION instance for "Sofi's Mini Donuts".
# Runs on its OWN VPS (4 GB / 2 vCPU). The box runs the operator's STANDARD
# hosting environment — a HOST-level Traefik (container `traefik`, on external
# network `portal-net`, dynamic config in /srv/portal/traefik/dynamic/). So this
# stack does NOT bring its own edge; `server` + `webapp` join `portal-net` and the
# host Traefik routes to them via traefik-dynamic/sofis-bc.yml (copied into the
# host's dynamic dir). Same pattern as docker/sandbox-bc/.
#
# Topology decisions (see README.md):
#   - HOST Traefik terminates TLS (Let's Encrypt resolver `letsencrypt`) and routes
#     to the two app services over `portal-net`. db/redis/etc. stay internal-only.
#   - Client logs in directly — Bigcapital JWT is the only auth gate. The router
#     reuses the host's predefined `security-headers@file` + `rate-limit@file`
#     middlewares. NO OAuth edge.
#   - Pinned GHCR images (${SERVER_IMAGE}/${WEBAPP_IMAGE}); manual updates only.
#   - Starts EMPTY (fresh organization). NOT a clone.
#   - mem_limits bound the stack so a leak can't take down SSH/OS on the small box.
#
# Apply from /srv/portal/clients/sofis-bc/ on the client VPS after scp'ing this
# file + .env + mariadb/ + redis/, and copying traefik-dynamic/sofis-bc.yml into
# /srv/portal/traefik/dynamic/ (host Traefik hot-reloads it).

services:
  webapp:
    container_name: bigcapital-sofis-webapp
    image: ${WEBAPP_IMAGE}
    init: true
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - bigcapital_sofis_network
      - portal-net

  server:
    container_name: bigcapital-sofis-server
    image: ${SERVER_IMAGE}
    init: true
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    networks:
      - bigcapital_sofis_network
      - portal-net
    environment:
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL}
      # Public instance with no OAuth edge — keep signup locked down. Create the
      # client's account once (SIGNUP_ALLOWED_EMAILS), then set SIGNUP_DISABLED=true.
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION}
      - GOTENBERG_URL=${GOTENBERG_URL}
      - GOTENBERG_DOCS_URL=${GOTENBERG_DOCS_URL}
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED}
      - PLAID_ENV=${PLAID_ENV}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}
      - HOSTED_ON_BIGCAPITAL_CLOUD=${HOSTED_ON_BIGCAPITAL_CLOUD}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT}
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID}
      - SQUARE_APPLICATION_SECRET=${SQUARE_APPLICATION_SECRET}
      - SQUARE_APPLICATION_ACCESS_TOKEN=${SQUARE_APPLICATION_ACCESS_TOKEN}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT}
      - SQUARE_OAUTH_REDIRECT_URL=${SQUARE_OAUTH_REDIRECT_URL}
      - SQUARE_TOKEN_ENCRYPTION_KEY=${SQUARE_TOKEN_ENCRYPTION_KEY}

  database_migration:
    container_name: bigcapital-sofis-database-migration
    image: ${SERVER_IMAGE}
    init: true
    working_dir: /app/packages/server
    command: >
      sh -c "
        echo 'Waiting for MySQL...' &&
        while ! nc -z mysql 3306 2>/dev/null; do sleep 2; done &&
        echo 'MySQL is up — running migrations' &&
        node dist/cli.js system:migrate:latest &&
        node dist/cli.js tenants:migrate:latest &&
        echo 'Migrations complete'
      "
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
    depends_on:
      - mysql
    networks:
      - bigcapital_sofis_network

  mysql:
    container_name: bigcapital-sofis-mysql
    restart: unless-stopped
    mem_limit: 768m
    build:
      context: ./mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${SYSTEM_DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - bigcapital_sofis_network

  redis:
    container_name: bigcapital-sofis-redis
    restart: unless-stopped
    mem_limit: 128m
    build:
      context: ./redis
    expose:
      - "6379"
    volumes:
      - redis:/data
    networks:
      - bigcapital_sofis_network

  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: bigcapital-sofis-gotenberg
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "3000"
    networks:
      - bigcapital_sofis_network

  minio:
    image: minio/minio:latest
    container_name: bigcapital-sofis-minio
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - bigcapital_sofis_network

  createbuckets:
    image: minio/mc:latest
    container_name: bigcapital-sofis-createbuckets
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        echo 'Waiting for MinIO...' &&
        until mc alias set local http://bigcapital-sofis-minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} 2>/dev/null; do sleep 2; done &&
        echo 'MinIO is up — creating bucket' &&
        mc mb --ignore-existing local/${S3_BUCKET} &&
        echo 'Bucket ready'
      "
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    networks:
      - bigcapital_sofis_network

volumes:
  mysql:
    name: bigcapital_sofis_mysql
    driver: local
  redis:
    name: bigcapital_sofis_redis
    driver: local
  minio:
    name: bigcapital_sofis_minio
    driver: local

networks:
  bigcapital_sofis_network:
    driver: bridge
  # Host Traefik's external network — created by /srv/portal/docker-compose.yml.
  portal-net:
    external: true
    name: portal-net
